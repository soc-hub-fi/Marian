package:
  name: marian
  authors:
    - "Tom Szymkowiak <thomas.szymkowiak@tuni.fi>"
    - "Antti Nurmi <antti.nurmi@tuni.fi>"

dependencies:
  apb:                { git: "https://github.com/pulp-platform/apb.git", version: 0.2.4  }
  apb_gpio:           { git: "https://github.com/pulp-platform/apb_gpio.git", rev: master }
  apb_node:           { git: "https://github.com/pulp-platform/apb_node", version: 0.1.0 }
  apb_timer:          { git: "https://github.com/pulp-platform/apb_timer.git", version: 0.1.0 }
  #ara:                { git: "https://github.com/pulp-platform/ara", rev: "ec0e37916b901961beab3974acc44ab5ea422db6" } # v3.0
  axi:                { git: "https://github.com/pulp-platform/axi.git", version: 0.35.3 }
  FPnew:              { git: "https://github.com/pulp-platform/fpnew.git",    rev: "8d4794d601c8dcea46c04fed51b05923fa1e94d5"}
  riscv-dbg:          { git: "https://github.com/pulp-platform/riscv-dbg.git", version: 0.8.1 }
  register_interface: { git: "https://github.com/pulp-platform/register_interface.git", version: 0.3.1 }

