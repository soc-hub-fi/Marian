  - name: axi_spi_master
    target_dir: src/vendor/axi_spi_master
    upstream: { git: "https://github.com/pulp-platform/axi_spi_master.git", rev: "ee219078353a76e468674c25675f5b7fe5f51127" }
    include_from_upstream:
      - spi_master_fifo.sv
      - spi_master_tx.sv
      - spi_master_rx.sv
      - spi_master_controller.sv
      - spi_master_clkgen.sv

  - name: rv_plic
    target_dir: src/vendor/pulp_rv_plic
    upstream: { git: "https://github.com/pulp-platform/rv_plic.git", rev: "5b5c5a4c1c15c3d7bb833071d344b2c2bc5f599d" }
