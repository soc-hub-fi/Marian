vendor_package:

  # vendor package because this CVA6/Ariane version is old and contains common cells locally,
  # causing module duplication (MODDUP) warnings.
  - name: ariane
    target_dir: src/vendor/cva6
    upstream: { git: "https://github.com/pulp-platform/cva6", rev: "bebbc1475f9ffba661e8354d8773e27ab9338db1" }
    include_from_upstream:
      - include/ariane_pkg.sv
      - include/ariane_axi_pkg.sv
      - include/std_cache_pkg.sv
      - include/wt_cache_pkg.sv
      - include/ariane_axi_pkg.sv
      - src/clint/axi_lite_interface.sv
      - src/axi_adapter.sv
      - tb/common/uart.sv
      - tb/common/mock_uart.sv
      - src/util/instr_tracer.sv
      - src/util/instr_tracer_if.sv
      - src/frontend/instr_queue.sv
      - src/frontend/instr_scan.sv
      - src/frontend/ras.sv
      - src/frontend/frontend.sv
      - src/frontend/btb.sv
      - src/frontend/bht.sv
      - src/cache_subsystem/cva6_icache.sv
      - src/cache_subsystem/wt_axi_adapter.sv
      - src/cache_subsystem/wt_cache_subsystem.sv
      - src/cache_subsystem/wt_dcache.sv
      - src/cache_subsystem/wt_dcache_ctrl.sv
      - src/cache_subsystem/wt_dcache_mem.sv
      - src/cache_subsystem/wt_dcache_missunit.sv
      - src/cache_subsystem/wt_dcache_wbuffer.sv
      - src/issue_read_operands.sv
      - src/decoder.sv
      - src/compressed_decoder.sv
      - src/issue_stage.sv
      - src/scoreboard.sv
      - src/commit_stage.sv
      - src/ariane_regfile_ff.sv
      - src/branch_unit.sv
      - src/instr_realign.sv
      - src/csr_regfile.sv
      - src/csr_buffer.sv
      - src/fpu_wrap.sv
      - src/perf_counters.sv
      - src/amo_buffer.sv
      - src/acc_dispatcher.sv
      - src/pmp/src/pmp.sv
      - src/mult.sv
      - src/re_name.sv
      - src/ptw.sv
      - src/mmu.sv
      - src/controller.sv
      - src/id_stage.sv
      - src/multiplier.sv
      - src/ex_stage.sv
      - src/load_store_unit.sv
      - src/load_unit.sv
      - src/store_unit.sv
      - src/store_buffer.sv
      - src/serdiv.sv
      - src/tlb.sv
      - src/alu.sv
      - src/ariane.sv

  - name: ara
    target_dir: src/vendor/ara
    upstream:  { git: "https://github.com/pulp-platform/ara", rev: "ec0e37916b901961beab3974acc44ab5ea422db6" } # v3.0
    include_from_upstream:
      - hardware/include/ara/ara.svh
      - hardware/src/axi_inval_filter.sv
      - hardware/src/axi_to_mem.sv
      - hardware/src/lane/fixed_p_rounding.sv
      - hardware/src/lane/operand_queue.sv
      - hardware/src/lane/power_gating_generic.sv
      - hardware/src/lane/simd_div.sv
      - hardware/src/lane/vector_fus_stage.sv
      - hardware/src/lane/vector_regfile.sv
      - hardware/src/lane/vmfpu.sv
      - hardware/src/masku/masku.sv
      - hardware/src/sldu/p2_stride_gen.sv
      - hardware/src/sldu/sldu.sv
      - hardware/src/sldu/sldu_op_dp.sv
      - hardware/src/vlsu/addrgen.sv
      - hardware/src/vlsu/vldu.sv
      - hardware/src/vlsu/vstu.sv

  
  - name: apb_spi_master
    target_dir: src/vendor/apb_spi_master
    upstream: { git: "https://github.com/pulp-platform/apb_spi_master.git", rev: "3fce81084b15870f4bd9da7806cf950774f9672e" }
    include_from_upstream:
      - apb_spi_master.sv
